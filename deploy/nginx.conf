# InnovaFit: nginx atiende campusinnovafit.tech con HTTPS y pasa todo a Node (127.0.0.1:3100).
# El certificado es de Let's Encrypt (certbot, validación por webroot) y se renueva solo.

# Puerto 80: responde la validación de Let's Encrypt y manda todo lo demás a HTTPS.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }

    location / {
        return 301 https://campusinnovafit.tech$request_uri;
    }
}

# www → dominio principal.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.campusinnovafit.tech;
    ssl_certificate     /etc/letsencrypt/live/campusinnovafit.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/campusinnovafit.tech/privkey.pem;
    return 301 https://campusinnovafit.tech$request_uri;
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    http2 on;
    server_name campusinnovafit.tech;

    ssl_certificate     /etc/letsencrypt/live/campusinnovafit.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/campusinnovafit.tech/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # Videos de las lecciones de hasta 2 GB
    client_max_body_size 2100m;
    proxy_request_buffering off;

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
}
